<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#070707">
<title>FOX AI</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent;
}

:root{
--bg:#070707;
--orange:#ff7300;
--text:#f5f5f5;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#070707;
color:var(--text);
font-family:Tahoma,Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
}

button,textarea,input{
font-family:inherit;
}

button{
border:0;
outline:none;
cursor:pointer;
}

.app{
width:100%;
max-width:700px;
height:100dvh;
position:relative;
overflow:hidden;
background:
radial-gradient(circle at 50% -10%,rgba(255,115,0,.13),transparent 38%),
#070707;
}

/* SPLASH */

.splash{
position:absolute;
inset:0;
z-index:100;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
background:#070707;
transition:.5s ease;
}

.splash.hide{
opacity:0;
pointer-events:none;
}

.fox-logo{
width:95px;
height:95px;
border-radius:30px;
display:flex;
align-items:center;
justify-content:center;
color:var(--orange);
font-size:42px;
font-weight:900;
border:1px solid rgba(255,115,0,.35);
background:radial-gradient(circle,rgba(255,115,0,.20),rgba(255,115,0,.03));
box-shadow:0 0 45px rgba(255,115,0,.16);
animation:foxPulse 1.5s infinite;
}

.splash-title{
margin-top:20px;
font-size:27px;
font-weight:900;
letter-spacing:3px;
}

.splash-title span,
.brand span,
.welcome h1 span{
color:var(--orange);
}

.splash-line{
width:80px;
height:3px;
margin-top:15px;
border-radius:10px;
background:var(--orange);
}

@keyframes foxPulse{
50%{transform:scale(1.06);}
}

/* HEADER */

.header{
height:64px;
position:absolute;
left:0;
right:0;
top:0;
z-index:20;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 13px;
background:rgba(7,7,7,.84);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(255,255,255,.055);
}

.header-side{
width:45px;
display:flex;
align-items:center;
}

.header-side.right{
justify-content:flex-start;
}

.header-side.left{
justify-content:flex-end;
}

.icon-btn{
width:42px;
height:42px;
border-radius:14px;
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.07);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
}

.plus{
color:var(--orange);
font-size:28px;
}

.menu-lines{
width:20px;
height:15px;
position:relative;
}

.menu-lines span{
position:absolute;
right:0;
width:20px;
height:2px;
border-radius:10px;
background:#fff;
}

.menu-lines span:nth-child(1){top:0}
.menu-lines span:nth-child(2){top:6px}
.menu-lines span:nth-child(3){top:12px}

.brand{
position:absolute;
left:50%;
transform:translateX(-50%);
font-size:18px;
font-weight:900;
letter-spacing:2px;
}

/* CHAT */

.chat{
position:absolute;
top:64px;
bottom:92px;
left:0;
right:0;
overflow-y:auto;
overflow-x:hidden;
padding:18px 13px 25px;
scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
width:4px;
}

.chat::-webkit-scrollbar-thumb{
background:rgba(255,115,0,.3);
border-radius:10px;
}

.welcome{
min-height:calc(100% - 10px);
display:flex;
align-items:center;
justify-content:center;
text-align:center;
flex-direction:column;
padding:25px;
}

.welcome-logo{
width:70px;
height:70px;
border-radius:24px;
display:flex;
align-items:center;
justify-content:center;
color:var(--orange);
font-size:30px;
font-weight:900;
border:1px solid rgba(255,115,0,.25);
background:rgba(255,115,0,.06);
}

.welcome h1{
margin-top:18px;
font-size:25px;
}

.welcome p{
margin-top:10px;
color:#888;
font-size:13px;
line-height:1.9;
}

.message{
width:100%;
display:flex;
margin:0 0 18px;
animation:messageIn .2s ease;
}

.message.user{
justify-content:flex-start;
}

.message.ai{
justify-content:flex-end;
}

.message-content{
max-width:94%;
display:flex;
flex-direction:column;
}

.user .message-content{
align-items:flex-start;
max-width:88%;
}

.ai .message-content{
align-items:flex-end;
max-width:94%;
}

@keyframes messageIn{
from{
opacity:0;
transform:translateY(7px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.bubble{
max-width:100%;
padding:12px 15px;
line-height:1.9;
font-size:15px;
white-space:pre-wrap;
word-break:break-word;
}

.user .bubble{
background:linear-gradient(135deg,rgba(255,115,0,.20),rgba(255,115,0,.07));
border:1px solid rgba(255,115,0,.18);
border-radius:18px 18px 4px 18px;
}

.ai .bubble{
max-width:100%;
padding:8px 3px;
background:transparent;
border:none;
text-align:right;
}

.ai .bubble.error{
color:#ff7777;
}

/* MESSAGE ACTIONS */

.message-actions{
display:flex;
align-items:center;
gap:5px;
margin-top:6px;
direction:rtl;
opacity:.88;
}

.user .message-actions{
align-self:flex-start;
}

.ai .message-actions{
align-self:flex-end;
}

.message-action{
height:30px;
padding:0 9px;
border-radius:9px;
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.07);
color:#aaa;
font-size:11px;
display:flex;
align-items:center;
justify-content:center;
gap:4px;
transition:.15s ease;
}

.message-action:active{
transform:scale(.94);
background:rgba(255,115,0,.10);
color:var(--orange);
}

.message-action:hover{
color:#fff;
border-color:rgba(255,115,0,.20);
}

.message-action.copy-action{
color:#ccc;
}

.message-action.edit-action{
color:#aaa;
}

.message-action.share-action{
color:#aaa;
}

/* TYPING */

.typing{
display:inline-flex;
gap:5px;
align-items:center;
padding:8px 0;
}

.typing span{
width:6px;
height:6px;
border-radius:50%;
background:var(--orange);
animation:typing 1s infinite;
}

.typing span:nth-child(2){
animation-delay:.15s;
}

.typing span:nth-child(3){
animation-delay:.3s;
}

@keyframes typing{
0%,60%,100%{
opacity:.25;
transform:translateY(0);
}
30%{
opacity:1;
transform:translateY(-4px);
}
}

/* CODE */

.code-wrap{
margin:12px 0;
direction:ltr;
text-align:left;
border:1px solid rgba(255,255,255,.08);
border-radius:13px;
overflow:hidden;
background:#050505;
}

.code-head{
height:36px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 9px;
background:#111;
border-bottom:1px solid rgba(255,255,255,.07);
}

.code-head span{
color:#888;
font-size:11px;
}

.copy-code{
color:var(--orange);
background:transparent;
font-size:11px;
}

.code-body{
overflow-x:auto;
padding:13px;
margin:0;
color:#eee;
font:12px/1.7 Consolas,monospace;
}

/* COMPOSER */

.file-input{
display:none;
}

.composer{
position:absolute;
left:10px;
right:10px;
bottom:10px;
min-height:61px;
z-index:25;
display:flex;
align-items:flex-end;
gap:7px;
padding:8px;
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
background:rgba(20,20,20,.94);
backdrop-filter:blur(20px);
box-shadow:0 12px 35px rgba(0,0,0,.45);
}

.attach-btn{
flex:0 0 43px;
width:43px;
height:43px;
border-radius:14px;
color:#ddd;
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.07);
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
}

.clip{
width:17px;
height:23px;
border:2px solid #bbb;
border-radius:9px;
transform:rotate(45deg);
position:relative;
}

.clip:after{
content:"";
position:absolute;
width:7px;
height:13px;
left:3px;
top:3px;
border:2px solid #bbb;
border-radius:6px;
}

.input{
flex:1;
max-height:130px;
min-height:43px;
resize:none;
outline:none;
border:0;
color:#fff;
background:transparent;
padding:11px 5px;
line-height:1.6;
font-size:15px;
}

.input::placeholder{
color:#666;
}

.send{
flex:0 0 43px;
width:43px;
height:43px;
border-radius:14px;
color:#000;
background:var(--orange);
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
touch-action:manipulation;
}

.send:disabled{
opacity:.35;
}

/* FILE PREVIEW */

.selected-files{
position:absolute;
left:10px;
right:10px;
bottom:76px;
z-index:24;
display:none;
gap:8px;
overflow-x:auto;
padding:7px 2px;
}

.selected-files.show{
display:flex;
}

.selected-file{
position:relative;
flex:0 0 auto;
width:75px;
height:75px;
border-radius:13px;
overflow:hidden;
background:#151515;
border:1px solid rgba(255,115,0,.25);
}

.selected-file img{
width:100%;
height:100%;
object-fit:cover;
}

.selected-file-doc{
height:100%;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:5px;
color:#ddd;
font-size:10px;
padding:5px;
text-align:center;
}

.selected-file-doc strong{
color:var(--orange);
font-size:12px;
}

.remove-file{
position:absolute;
top:4px;
left:4px;
width:23px;
height:23px;
border-radius:50%;
background:rgba(0,0,0,.8);
color:#fff;
font-size:15px;
z-index:2;
}

/* MESSAGE FILE */

.attachments-message{
display:flex;
flex-direction:column;
gap:8px;
margin-bottom:8px;
}

.message-file{
display:flex;
align-items:center;
gap:9px;
min-width:170px;
max-width:270px;
padding:9px 11px;
border-radius:13px;
background:rgba(0,0,0,.25);
border:1px solid rgba(255,255,255,.08);
}

.message-file-icon{
width:35px;
height:35px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,115,0,.12);
color:var(--orange);
font-size:10px;
font-weight:bold;
}

.message-file-name{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-size:12px;
color:#ddd;
}

.chat-image{
display:block;
max-width:230px;
max-height:250px;
border-radius:15px;
border:1px solid rgba(255,115,0,.18);
object-fit:cover;
}

/* DRAWER */

.overlay{
position:absolute;
inset:0;
z-index:50;
background:rgba(0,0,0,.58);
opacity:0;
pointer-events:none;
transition:.25s;
}

.overlay.open{
opacity:1;
pointer-events:auto;
}

.drawer{
position:absolute;
top:0;
bottom:0;
right:0;
width:min(86%,350px);
z-index:60;
background:#0c0c0c;
border-left:1px solid rgba(255,115,0,.15);
transform:translateX(105%);
transition:.28s;
display:flex;
flex-direction:column;
}

.drawer.open{
transform:translateX(0);
}

.drawer-head{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
border-bottom:1px solid rgba(255,255,255,.06);
}

.drawer-title{
font-size:18px;
font-weight:bold;
}

.close{
width:40px;
height:40px;
border-radius:12px;
color:#fff;
background:rgba(255,255,255,.05);
font-size:20px;
}

.drawer-body{
flex:1;
overflow-y:auto;
padding:12px;
}

.new-chat{
width:100%;
height:47px;
border-radius:14px;
color:#fff;
background:rgba(255,115,0,.11);
border:1px solid rgba(255,115,0,.2);
margin-bottom:13px;
font-size:14px;
}

.history-title{
color:#777;
font-size:11px;
margin:12px 5px 8px;
}

.history-item{
position:relative;
width:100%;
min-height:50px;
padding:9px 11px;
margin-bottom:7px;
border-radius:13px;
background:rgba(255,255,255,.035);
border:1px solid rgba(255,255,255,.045);
color:#ddd;
text-align:right;
}

.history-item.active{
border-color:rgba(255,115,0,.25);
background:rgba(255,115,0,.07);
}

.history-text{
display:block;
padding-left:30px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
font-size:12px;
}

.delete-history{
position:absolute;
left:8px;
top:50%;
transform:translateY(-50%);
width:27px;
height:27px;
border-radius:8px;
background:rgba(255,70,70,.08);
color:#ff7777;
}

.drawer-footer{
padding:12px;
border-top:1px solid rgba(255,255,255,.06);
}

.clear-history{
width:100%;
height:44px;
border-radius:13px;
color:#ff7777;
background:rgba(255,60,60,.07);
}

/* SUPPORT */

.support-btn{
width:100%;
height:47px;
margin-top:9px;
border-radius:14px;
color:#fff;
background:rgba(255,115,0,.08);
border:1px solid rgba(255,115,0,.18);
font-size:14px;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}

.support-btn:active{
transform:scale(.98);
}

.support-dot{
width:9px;
height:9px;
border-radius:50%;
background:var(--orange);
box-shadow:0 0 10px rgba(255,115,0,.5);
}

/* SUPPORT MODAL */

.support-modal{
position:absolute;
inset:0;
z-index:90;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:rgba(0,0,0,.68);
backdrop-filter:blur(8px);
opacity:0;
pointer-events:none;
transition:.25s;
}

.support-modal.open{
opacity:1;
pointer-events:auto;
}

.support-box{
width:100%;
max-width:360px;
padding:22px;
border-radius:24px;
background:rgba(20,20,20,.96);
border:1px solid rgba(255,115,0,.18);
box-shadow:0 20px 60px rgba(0,0,0,.55);
text-align:center;
transform:translateY(15px) scale(.96);
transition:.25s;
}

.support-modal.open .support-box{
transform:translateY(0) scale(1);
}

.support-box h2{
font-size:20px;
margin-bottom:7px;
}

.support-box p{
font-size:12px;
color:#888;
margin-bottom:20px;
}

.social-options{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.social-btn{
height:105px;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:9px;
color:#fff;
font-size:13px;
font-weight:bold;
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.08);
transition:.18s;
}

.social-btn:active{
transform:scale(.95);
}

.social-icon{
width:48px;
height:48px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
font-weight:900;
}

.rubika-icon{
background:#1787e8;
color:#fff;
}

.instagram-icon{
background:linear-gradient(135deg,#feda75,#d62976,#962fbf,#4f5bd5);
color:#fff;
}

.support-close{
width:100%;
height:44px;
margin-top:14px;
border-radius:14px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.07);
color:#aaa;
font-size:13px;
}

/* TOAST */

.toast{
position:absolute;
z-index:100;
left:50%;
bottom:90px;
transform:translate(-50%,20px);
opacity:0;
pointer-events:none;
padding:10px 15px;
border-radius:12px;
background:#191919;
border:1px solid rgba(255,115,0,.2);
color:#ddd;
font-size:12px;
transition:.25s;
white-space:nowrap;
}

.toast.show{
opacity:1;
transform:translate(-50%,0);
}
</style>
</head>

<body>

<div class="app">

<div class="splash" id="splash">
<div class="fox-logo">F</div>
<div class="splash-title">FOX <span>AI</span></div>
<div class="splash-line"></div>
</div>

<header class="header">

<div class="header-side right">
<button class="icon-btn" id="menuBtn" type="button">
<div class="menu-lines">
<span></span>
<span></span>
<span></span>
</div>
</button>
</div>

<div class="brand">
FOX <span>AI</span>
</div>

<div class="header-side left">
<button class="icon-btn plus" id="newChatBtn" type="button">+</button>
</div>

</header>

<main class="chat" id="chat">

<div class="welcome" id="welcome">

<div class="welcome-logo">F</div>

<h1>
به <span>FOX AI</span> خوش آمدید
</h1>

<p>
سوالت را بنویس و ارسال کن.<br>
عکس، PDF و فایل متنی هم می‌توانی ارسال کنی.
</p>

</div>

</main>

<div class="selected-files" id="selectedFiles"></div>

<div class="composer">

<button class="attach-btn" id="attachBtn" type="button">
<div class="clip"></div>
</button>

<input
type="file"
id="fileInput"
class="file-input"
multiple
accept="image/*,application/pdf,text/*,.txt,.csv,.json,.html,.htm,.css,.js,.md,.xml,.log,.py,.java,.cpp,.c,.php"
>

<textarea
id="input"
class="input"
rows="1"
placeholder="پیامت را بنویس..."
autocomplete="off"
spellcheck="false"
></textarea>

<button class="send" id="sendBtn" type="button">↑</button>

</div>

<div class="overlay" id="overlay"></div>

<aside class="drawer" id="drawer">

<div class="drawer-head">

<div class="drawer-title">
تاریخچه چت
</div>

<button class="close" id="closeMenu" type="button">
×
</button>

</div>

<div class="drawer-body">

<button class="new-chat" id="drawerNewChat" type="button">
+ چت جدید
</button>

<div class="history-title">
گفتگوهای قبلی
</div>

<div id="historyList"></div>

<button class="support-btn" id="supportBtn" type="button">
<span class="support-dot"></span>
پشتیبانی FOX AI
</button>

</div>

<div class="drawer-footer">

<button class="clear-history" id="clearHistory" type="button">
پاک کردن همه تاریخچه
</button>

</div>

</aside>

<!-- SUPPORT MODAL -->

<div class="support-modal" id="supportModal">

<div class="support-box">

<h2>پشتیبانی FOX AI</h2>

<p>
برای ارتباط با ما یکی از شبکه‌های اجتماعی زیر را انتخاب کنید.
</p>

<div class="social-options">

<button class="social-btn" id="rubikaBtn" type="button">
<div class="social-icon rubika-icon">R</div>
<span>روبیکا</span>
</button>

<button class="social-btn" id="instagramBtn" type="button">
<div class="social-icon instagram-icon">◎</div>
<span>اینستاگرام</span>
</button>

</div>

<button class="support-close" id="supportClose" type="button">
بستن
</button>

</div>

</div>

<div class="toast" id="toast"></div>

</div>

<script>

/* CONFIG */

const GROQ_API_KEY =
"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";

const MODEL =
"openai/gpt-oss-20b";

const IMAGE_MODEL =
"meta-llama/llama-4-scout-17b-16e-instruct";

const API_URL =
"https://api.groq.com/openai/v1/chat/completions";

const STORAGE_KEY =
"fox_ai_history_final";

/* ELEMENTS */

const splash=document.getElementById("splash");
const chat=document.getElementById("chat");
const welcome=document.getElementById("welcome");
const input=document.getElementById("input");
const sendBtn=document.getElementById("sendBtn");
const attachBtn=document.getElementById("attachBtn");
const fileInput=document.getElementById("fileInput");
const selectedFiles=document.getElementById("selectedFiles");
const menuBtn=document.getElementById("menuBtn");
const closeMenu=document.getElementById("closeMenu");
const overlay=document.getElementById("overlay");
const drawer=document.getElementById("drawer");
const newChatBtn=document.getElementById("newChatBtn");
const drawerNewChat=document.getElementById("drawerNewChat");
const historyList=document.getElementById("historyList");
const clearHistory=document.getElementById("clearHistory");
const supportBtn=document.getElementById("supportBtn");

function isAllowedFile(file){

if(file.type&&file.type.startsWith("image/"))return true;

if(file.type==="application/pdf")return true;

const name=file.name.toLowerCase();

const extensions=[
".txt",".csv",".json",".html",".htm",".css",
".js",".md",".xml",".log",".py",".java",
".cpp",".c",".php",".pdf"
];

return extensions.some(function(ext){

return name.endsWith(ext);

});

}

/* FILE HELPERS */

function getExtension(name){

const parts=name.split(".");

if(parts.length<2)return"FILE";

return(parts.pop()||"FILE").toUpperCase();

}

function shortName(name){

if(name.length<=14)return name;

return name.substring(0,11)+"...";

}

/* READ TEXT */

function readTextFile(file){

return new Promise(function(resolve,reject){

const reader=new FileReader();

reader.onload=function(){

resolve(reader.result||"");

};

reader.onerror=function(){

reject(
new Error("خواندن فایل ناموفق بود")
);

};

reader.readAsText(file,"UTF-8");

});

}

/* PDF */

let pdfReady=null;

function loadPDFJS(){

if(pdfReady)return pdfReady;

pdfReady=new Promise(function(resolve,reject){

if(window.pdfjsLib){

resolve(window.pdfjsLib);
return;

}

const script=document.createElement("script");

script.src=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

script.type="module";

script.onload=function(){

setTimeout(function(){

if(window.pdfjsLib){

resolve(window.pdfjsLib);

}else{

reject(
new Error("PDF.js در مرورگر آماده نشد")
);

}

},500);

};

script.onerror=function(){

reject(
new Error("PDF.js بارگذاری نشد")
);

};

document.head.appendChild(script);

});

return pdfReady;

}

async function readPDF(file){

try{

const pdfjs=await loadPDFJS();

if(!pdfjs||!pdfjs.getDocument){

throw new Error("PDF engine unavailable");

}

const buffer=await file.arrayBuffer();

const pdf=await pdfjs.getDocument({
data:buffer
}).promise;

let result="";

for(let page=1;page<=pdf.numPages;page++){

const pdfPage=await pdf.getPage(page);

const content=await pdfPage.getTextContent();

const text=content.items.map(function(item){

return item.str;

}).join(" ");

result+=
"\n\n--- صفحه "+
page+
" ---\n"+
text;

}

return result;

}catch(error){

console.error("PDF error:",error);

return(
"این فایل PDF انتخاب شده است، اما متن آن از داخل مرورگر قابل استخراج نبود."
);

}

}

/* DATA URL */

function fileToDataURL(file){

return new Promise(function(resolve,reject){

const reader=new FileReader();

reader.onload=function(){

resolve(reader.result);

};

reader.onerror=function(){

reject(
new Error("تصویر خوانده نشد")
);

};

reader.readAsDataURL(file);

});

}

/* PROCESS FILES */

async function processFiles(files){

const result=[];

for(const file of files){

if(file.type.startsWith("image/")){

const dataURL=await fileToDataURL(file);

result.push({
type:"image",
name:file.name,
mime:file.type,
dataURL:dataURL
});

continue;

}

if(
file.type==="application/pdf"||
file.name.toLowerCase().endsWith(".pdf")
){

const text=await readPDF(file);

result.push({
type:"text",
name:file.name,
mime:"application/pdf",
text:text
});

continue;

}

const text=await readTextFile(file);

result.push({
type:"text",
name:file.name,
mime:file.type||"text/plain",
text:text
});

}

return result;

}

/* COPY MESSAGE */

async function copyMessage(text,button){

try{

if(navigator.clipboard){

await navigator.clipboard.writeText(text);

}else{

const area=document.createElement("textarea");

area.value=text;

document.body.appendChild(area);

area.select();

document.execCommand("copy");

area.remove();

}

const old=button.textContent;

button.textContent="کپی شد";

setTimeout(function(){

button.textContent=old;

},1400);

}catch(error){

showToast("کپی انجام نشد");

}

}

-1,
false
);

<span></span>
<span></span>

try{

});

let imageText="";

if(images.length){

imageText=await analyzeImages(
images,
userText
);

}

let fileText="";

textFiles.forEach(function(file){

const content=String(file.text||"")
.substring(0,120000);

fileText+=
"\n\n===== "+
file.name+
" =====\n"+
content;

});

let finalText=userText||"";

if(imageText){

finalText+=
"\n\nنتیجه بررسی تصویر:\n"+
imageText;

}

if(fileText){

finalText+=
"\n\nمحتوای فایل:\n"+
fileText;

}

if(!finalText.trim()){

finalText=
"فایل پیوست‌شده را بررسی کن و نتیجه را توضیح بده.";

}

const messages=[

{
role:"system",
content:
"You are FOX AI, a helpful, fast and accurate AI assistant. "+
"If the user writes Persian, answer in Persian. "+
"Analyze attached file contents carefully. "+
"Do not use emojis unless specifically requested."
}

];

currentChat.messages.slice(0,-1).forEach(function(message){

messages.push({

role:
message.role==="assistant"
?"assistant"
:"user",

content:message.content||""

});

});

messages.push({

role:"user",
content:finalText

});

const response=await fetch(
API_URL,
{

method:"POST",

headers:{
"Content-Type":"application/json",
"Authorization":"Bearer "+GROQ_API_KEY
},

body:JSON.stringify({

model:MODEL,
messages:messages,
temperature:.6,
max_completion_tokens:4096,
stream:true

}
);

if(!response.ok){

let errorMessage="اتصال به سرویس هوش مصنوعی برقرار نشد";

try{

const data=await response.json();

if(data?.error?.message){

errorMessage=data.error.message;

}

}catch(error){}

throw new Error(
"SERVER_ERROR:"+errorMessage
);

if(!response.body){

throw new Error(
"SERVER_ERROR:اتصال به سرویس هوش مصنوعی برقرار نشد"
);

const reader=response.body.getReader();

const decoder=new TextDecoder("utf-8");

let buffer="";
let answer="";

typing.innerHTML="";

while(true){

const result=await reader.read();

if(result.done)break;

buffer+=decoder.decode(
result.value,
{stream:true}
);

const lines=buffer.split("\n");

buffer=lines.pop()||"";

for(const line of lines){

trimmed==="data: [DONE]"
){

if(!trimmed.startsWith("data:"))continue;

const jsonText=
trimmed.substring(5).trim();

data?.choices?.[0]?.delta?.content;

role:"assistant",
content:answer,
attachments:[]

});

const parent=typing.closest(".message");

"assistant",
answer,
[],
true,
aiIndex,
true
);

error

-1,

sendBtn.disabled=false;

/* FORMAT */

function formatAIText(text){

if(!text)return"";

const blocks=[];

let safe=text.replace(
/```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g,
function(match,language,code){

const index=blocks.length;

blocks.push({
language:language||"code",
code:code.trim()
});

return"___FOX_CODE_"+index+"___";

}
);

safe=escapeHTML(safe);

safe=safe.replace(
/___FOX_CODE_(\d+)___/g,
function(match,index){

const block=blocks[index];

return`
<div class="code-wrap">
<div class="code-head">
<span>${escapeHTML(block.language)}</span>
<button
class="copy-code"
type="button"
onclick="copyCode(this)"
data-code="${encodeURIComponent(block.code)}"
>
کپی
</button>
</div>
<pre class="code-body">${escapeHTML(block.code)}</pre>
</div>
`;

}
);

return safe;

}

/* COPY CODE */

window.copyCode=async function(button){

try{

const code=
decodeURIComponent(
button.dataset.code
);

await navigator.clipboard.writeText(code);

button.textContent="کپی شد";

setTimeout(function(){

button.textContent="کپی";

},1500);

}catch(error){

showToast("کپی انجام نشد");

}

};

/* ESCAPE */

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* SCROLL */

function scrollBottom(){

requestAnimationFrame(function(){

chat.scrollTop=chat.scrollHeight;

});

/* TOAST */

function showToast(message){

toast.textContent=message;

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer=setTimeout(function(){

toast.classList.remove("show");

},2200);

}
